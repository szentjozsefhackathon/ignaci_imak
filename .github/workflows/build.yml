name: Build & Release App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Required for pushing to GitHub Container Registry (GHCR)
permissions:
  contents: write
  packages: write

jobs:
  # --- JOB 1: Web & Docker ---
  build-web-docker:
    name: Build Web & Push Docker
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract version from tag
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Create .env file
        uses: jakubcieslik99/secrets-vars-to-env-file-action@main
        with:
          secrets: ${{ toJSON(secrets) }}
          vars: ${{ toJSON(vars) }}
          exclude: FLUTTER_ROOT, PUB_CACHE, GHRC_TOKEN

      - name: Install dependencies
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build Flutter Web
        run: |
          dart tools/download_sqlite3_wasm.dart
          dart compile js -O4 web/drift_worker.dart --output web/drift_worker.js
          flutter build web --release --base-href="/web-app/" \
            --build-name=${{ env.VERSION_NAME }} \
            --build-number=${{ env.VERSION_CODE }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./web/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ignacio-flutter-web:latest
            ghcr.io/${{ github.repository_owner }}/ignacio-flutter-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  # --- JOB 2: Android ---
  build-android:
    name: Build & Publish Android
    runs-on: ubuntu-latest
    environment: deploy
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract version from tag
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Create .env file
        uses: jakubcieslik99/secrets-vars-to-env-file-action@main
        with:
          secrets: ${{ toJSON(secrets) }}
          vars: ${{ toJSON(vars) }}
          exclude: FLUTTER_ROOT, PUB_CACHE, GHRC_TOKEN

      - name: Install dependencies
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Decode keystore & Create properties
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --build-name=${{ env.VERSION_NAME }} \
            --build-number=${{ env.VERSION_CODE }}

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play Console
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: hu.jezsuita.ignaciima
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: production
          status: completed
          inAppUpdatePriority: 2
          # userFraction: 0.1

  # --- JOB 3: iOS ---
  build-ios:
    name: Build & Publish iOS
    runs-on: macos-latest
    environment: deploy
    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract version from tag
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Create .env file
        uses: jakubcieslik99/secrets-vars-to-env-file-action@main
        with:
          secrets: ${{ toJSON(secrets) }}
          vars: ${{ toJSON(vars) }}
          exclude: FLUTTER_ROOT, PUB_CACHE, GHRC_TOKEN

      - name: Install dependencies
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Import signing certificate
        if: ${{ env.IOS_CERTIFICATE_BASE64 != '' }}
        run: |
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          echo "${{ secrets.IOS_CERTIFICATE_BASE64 }}" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain \
            -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k temp build.keychain

      - name: Install provisioning profile
        if: ${{ env.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" \
            | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/ignaciima_appstore.mobileprovision

      - name: Build Release IPA
        run: |
          flutter build ipa --release --no-codesign \
            --build-name=${{ env.VERSION_NAME }} \
            --build-number=${{ env.VERSION_CODE }} \
            --export-options-plist=ios/export_options.plist

      - name: Compress and Upload iOS Artifact
        run: |
          cd build
          tar -czf ios_build.tar.gz ios

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: build/ios_build.tar.gz

      - name: Setup App Store Connect API Key
        if: ${{ env.APP_STORE_KEY_ID != '' }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_KEY_CONTENT }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8

      - name: Upload to App Store Connect
        if: ${{ env.APP_STORE_KEY_ID != '' }}
        run: |
          xcrun notarytool submit build/ios/ipa/*.ipa \
            --key-id ${{ secrets.APP_STORE_KEY_ID }} \
            --issuer ${{ secrets.APP_STORE_ISSUER_ID }} \
            --key ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8 \
            --wait

  # --- JOB 4: Create GitHub Release ---
  create-release:
    name: Finalize GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "android-release/*.aab,ios-release/*.tar.gz"
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
